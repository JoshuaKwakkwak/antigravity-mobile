<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Antigravity 모바일</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 24px;
            background: #0f172a; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center;
        }
        .logo-box {
            width: 84px; height: 84px; border-radius: 22px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            margin-bottom: 20px; animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }
        .logo-box img { width: 52px; height: 52px; }
        h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px 0; }
        p { font-size: 14px; color: #94a3b8; margin: 0 0 20px 0; line-height: 1.5; }
        .spinner {
            width: 32px; height: 32px; border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6366f1; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-badge {
            background: rgba(99, 102, 241, 0.15); color: #818cf8;
            padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3); margin-bottom: 24px;
        }
        .btn-enter {
            display: inline-block; padding: 16px 36px; background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #ffffff; text-decoration: none; border-radius: 14px; font-weight: 700; font-size: 17px;
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45); border: none; cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-enter:active { transform: scale(0.97); }
        .offline-box {
            display: none; background: #1e293b; border: 1px solid #334155;
            border-radius: 16px; padding: 20px; max-width: 320px; margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="logo-box">
        <img src="icon.png" alt="Antigravity">
    </div>
    
    <div class="spinner" id="spinner"></div>
    <div class="status-badge" id="badge">⚡ 자리 PC 연결 중...</div>
    
    <h1 id="title">Antigravity 모바일</h1>
    <p id="desc">실시간 전용 터널로 안전하게 연결하고 있습니다.</p>

    <!-- 원터치 직행 버튼 -->
    <div style="margin-top: 8px; margin-bottom: 16px;">
        <a id="btnDirect" href="https://biggest-wrestling-totally-socket.trycloudflare.com" class="btn-enter">
            🚀 대화방 지금 바로 열기
        </a>
    </div>

    <!-- PC 오프라인 시 안내 박스 -->
    <div class="offline-box" id="offlineBox">
        <h3 style="margin: 0 0 8px 0; font-size: 15px; color: #f87171;">💻 PC 오프라인 / 절전 상태</h3>
        <p style="font-size: 13px; margin-bottom: 16px; color: #94a3b8;">
            자리 PC가 꺼져 있거나 절전 모드입니다.<br>PC가 켜져 있으면 자동으로 연결됩니다.
        </p>
        <button onclick="checkConnection()" style="padding:10px 20px; background:#334155; color:#f8fafc; border:none; border-radius:10px; font-weight:600; cursor:pointer;">
            🔄 다시 확인하기
        </button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(()=>{});
        }

        const API_URL = 'https://api.github.com/gists/646fb600ef56123ae21ac6c39683ad9a';
        let targetUrl = 'https://biggest-wrestling-totally-socket.trycloudflare.com';

        async function checkConnection() {
            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.files && data.files['tunnel.json']) {
                        const tunnelData = JSON.parse(data.files['tunnel.json'].content);
                        if (tunnelData && tunnelData.url) {
                            targetUrl = tunnelData.url;
                            document.getElementById('btnDirect').href = targetUrl;
                            document.getElementById('badge').textContent = '🚀 PC 연결 확인! 대화방 이동 중...';
                            setTimeout(() => {
                                window.location.replace(targetUrl);
                            }, 300);
                            return;
                        }
                    }
                }
            } catch (e) {
                console.warn('API lookup warning:', e);
            }

            // 폴백: 기본 타깃 URL로 바로 이동 시도
            if (targetUrl) {
                document.getElementById('badge').textContent = '🚀 대화방으로 이동 중...';
                setTimeout(() => {
                    window.location.replace(targetUrl);
                }, 400);
                return;
            }

            document.getElementById('spinner').style.display = 'none';
            document.getElementById('offlineBox').style.display = 'block';
        }

        // 페이지 열리자마자 즉각 연결 실행
        checkConnection();
    </script>
</body>
</html>
