<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Antigravity 모바일</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 24px;
            background: #0f172a; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; text-align: center;
        }
        .logo-box {
            width: 88px; height: 88px; border-radius: 24px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            margin-bottom: 24px; animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .logo-box img { width: 56px; height: 56px; }
        h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px 0; }
        p { font-size: 14px; color: #94a3b8; margin: 0 0 24px 0; line-height: 1.5; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6366f1; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-badge {
            background: rgba(99, 102, 241, 0.15); color: #818cf8;
            padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3); margin-bottom: 20px;
        }
        .btn {
            display: inline-block; padding: 14px 28px; background: #4f46e5; color: white;
            text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 16px;
            border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
        }
        .offline-box {
            display: none; background: #1e293b; border: 1px solid #334155;
            border-radius: 16px; padding: 20px; max-width: 320px; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="logo-box">
        <img src="icon.png" alt="Antigravity">
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="status-badge" id="badge">⚡ 실시간 게이트웨이 연결 중...</div>
    <h1 id="title">Antigravity 모바일</h1>
    <p id="desc">자리 PC의 실시간 암호화 터널을 탐색하고 있습니다.</p>
    
    <div class="offline-box" id="offlineBox">
        <h3 style="margin: 0 0 8px 0; font-size: 16px; color: #f87171;">💻 PC 오프라인 / 절전 상태</h3>
        <p style="font-size: 13px; margin-bottom: 16px; color: #94a3b8;">
            자리 PC가 꺼져 있거나 절전 모드입니다.<br>PC가 켜져 있으면 자동으로 연결됩니다.
        </p>
        <button class="btn" onclick="connectLive()">🔄 다시 연결 시도</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(()=>{});
        }

        const GIST_URL = 'https://gist.githubusercontent.com/JoshuaKwakkwak/646fb600ef56123ae21ac6c39683ad9a/raw/tunnel.json?t=' + Date.now();

        async function connectLive() {
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('badge').style.display = 'inline-block';
            document.getElementById('badge').textContent = '⚡ 실시간 게이트웨이 연결 중...';
            document.getElementById('offlineBox').style.display = 'none';

            try {
                const res = await fetch(GIST_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error('Gateway fetch error');
                const data = await res.json();
                
                if (data && data.url) {
                    document.getElementById('badge').textContent = '🚀 PC 연결 성공! 화면 이동 중...';
                    setTimeout(() => {
                        window.location.replace(data.url);
                    }, 200);
                    return;
                }
            } catch (err) {
                console.warn('Gist lookup failed:', err);
            }

            document.getElementById('spinner').style.display = 'none';
            document.getElementById('badge').style.display = 'none';
            document.getElementById('desc').textContent = 'PC 연결 신호를 대기하고 있습니다.';
            document.getElementById('offlineBox').style.display = 'block';
        }

        connectLive();
    </script>
</body>
</html>
